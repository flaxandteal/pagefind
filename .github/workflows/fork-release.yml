# Fork release: pushing a v*-catalogue.* tag builds the binaries and a node
# wrapper tarball and attaches them to a GitHub prerelease. Nothing is
# published to crates.io, npm or PyPI. Build job copied from upstream release.yml.
name: Fork Release

on:
  push:
    tags:
      - "v*-catalogue.*"

permissions: {}

env:
  CARGO_TERM_COLOR: always
  WASM_PACK_VERSION: "v0.14.0"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
            run_tests: true
          - build: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            cross: false
            run_tests: true
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: false
            run_tests: true
          - build: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: false
            run_tests: false
          - build: macos
            os: macos-latest
            target: x86_64-apple-darwin
            cross: false
            run_tests: true
          - build: macos-m1
            os: macos-latest
            target: aarch64-apple-darwin
            cross: false
            run_tests: false
          - build: freebsd
            os: ubuntu-latest
            target: x86_64-unknown-freebsd
            cross: true
            run_tests: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            target
          key: ${{ runner.os }}-stable

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Get Version
        run: echo GIT_VERSION="${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Get Tag
        run: echo GIT_TAG="$(node ./.backstage/get_tag.cjs)" >> $GITHUB_ENV

      - name: Verify Changelog
        if: env.GIT_TAG == 'latest' || env.GIT_TAG == 'beta' || env.GIT_TAG == 'rc'
        run: |
          node ./.backstage/changelog.cjs

      - name: Install Linker
        if: matrix.cross
        run: |
          sudo apt update
          sudo apt install ${{ matrix.linker }}
      - name: Install MUSL Tooling
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update -y
          sudo apt install -y musl-tools musl-dev
      - name: Install aarch64 Tooling
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt update -y
          sudo apt install -y clang gcc-aarch64-linux-gnu
          curl -sL https://github.com/cross-tools/musl-cross/releases/download/20250929/aarch64-unknown-linux-musl.tar.xz | sudo tar xJ -C /opt/
          echo "CC_aarch64_unknown_linux_musl=/opt/aarch64-unknown-linux-musl/bin/aarch64-unknown-linux-musl-gcc" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=/opt/aarch64-unknown-linux-musl/bin/aarch64-unknown-linux-musl-gcc" >> $GITHUB_ENV

      - name: Install Nightly Rust
        run: |
          rustup toolchain install nightly --component rustfmt,clippy,rust-src --target ${{ matrix.target }}
          rustup default nightly

      - name: Install Rust
        run: |
          rustup toolchain install stable --component rustfmt,clippy --target ${{ matrix.target }}
          rustup default stable

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: ${{env.WASM_PACK_VERSION}}

      - name: Install cross (FreeBSD binary build)
        if: matrix.cross == true
        run: cargo install cross

      - name: Set up python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Prepare Git
        run: |
          git config user.email "github@github.com"
          git config user.name "Github Actions"
          # Use throw-away branch so we don't push the changes to origin
          git checkout -B deploy_branch
      - name: Prepare Crates
        run: |
          # Update cargo version,
          node ./.backstage/version.cjs
          git add ./pagefind/Cargo.toml
          git add ./pagefind_web/Cargo.toml
          git add ./pagefind_ui/default/package.json
          git add ./pagefind_ui/modular/package.json
          git add ./pagefind_ui/component/package.json
          # Commit changes so cargo doesn't complain about dirty repo
          git commit -m "Deploy changes."

      - name: Build Coupled JS
        working-directory: ./pagefind_web_js
        run: npm i && npm run build-coupled

      - name: Build WASM
        working-directory: ./pagefind_web
        run: ./local_build.sh

      - name: Build UI
        working-directory: ./pagefind_ui/default
        run: npm i && npm run build

      - name: Build Modular UI
        working-directory: ./pagefind_ui/modular
        run: npm i && npm run build

      - name: Build Component UI
        working-directory: ./pagefind_ui/component
        run: npm i && npm run build

      - name: Build Playground
        working-directory: ./pagefind_playground
        run: npm i && npm run build

      - name: Test Web
        if: matrix.run_tests
        working-directory: ./pagefind_web
        run: cargo test --release

      - name: Build
        working-directory: ./pagefind
        if: matrix.build != 'freebsd'
        run: cargo build --release --target ${{ matrix.target }} --features extended
      - name: Build FreeBSD Binary
        working-directory: ./pagefind
        if: matrix.build == 'freebsd'
        run: cross build --release --target ${{ matrix.target }} --features extended
      - name: Test Lib
        if: matrix.run_tests
        working-directory: ./pagefind
        run: cargo test --release --target ${{ matrix.target }} --features extended

      - name: Test CLI
        if: matrix.run_tests
        run: npx -y toolproof@0.18.0 -s -c 1 --timeout 45 --retry-count 2 --placeholders pagefind_mode="${{ matrix.target }}/release"

      - name: Move extended binary aside
        run: |
          cp target/${{ matrix.target }}/release/pagefind target/${{ matrix.target }}/release/pagefind_extended

      - name: Build Non-Extended
        working-directory: ./pagefind
        if: matrix.build != 'freebsd'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Non-Extended (FreeBSD)
        if: matrix.build == 'freebsd'
        working-directory: ./pagefind
        run: cross build --release --target ${{ matrix.target }}

      - name: Create Standard Release
        run: |
          EXEC_NAME="pagefind"
          ASSET_PATH="$EXEC_NAME-v$GIT_VERSION-${{ matrix.target }}.tar.gz"
          CHECKSUM_PATH="$ASSET_PATH.sha256"

          if [ "$RUNNER_OS" == "Windows" ]; then
            EXEC_NAME="pagefind.exe"
          fi

          if command -v gtar &> /dev/null; then
            echo "Using gtar"
            gtar czf $ASSET_PATH -C target/${{ matrix.target }}/release $EXEC_NAME
          else
            echo "Using system tar"
            tar czf $ASSET_PATH -C target/${{ matrix.target }}/release $EXEC_NAME
          fi

          case $RUNNER_OS in
              Windows)
                  sha256sum $ASSET_PATH > $CHECKSUM_PATH
                  ;;
              Linux)
                  sha256sum $ASSET_PATH > $CHECKSUM_PATH
                  ;;
              macOS)
                  shasum -a 256 $ASSET_PATH > $CHECKSUM_PATH
                  ;;
          esac

          echo "ASSET_PATH=$ASSET_PATH" >> $GITHUB_ENV
          echo "CHECKSUM_PATH=$CHECKSUM_PATH" >> $GITHUB_ENV

      - name: Create Extended Release
        run: |
          EXEC_NAME="pagefind_extended"
          ASSET_PATH="$EXEC_NAME-v$GIT_VERSION-${{ matrix.target }}.tar.gz"
          CHECKSUM_PATH="$ASSET_PATH.sha256"

          if [ "$RUNNER_OS" == "Windows" ]; then
            EXEC_NAME="pagefind_extended.exe"
          fi

          if command -v gtar &> /dev/null; then
            echo "Using gtar"
            gtar czf $ASSET_PATH -C target/${{ matrix.target }}/release $EXEC_NAME
          else
            echo "Using system tar"
            tar czf $ASSET_PATH -C target/${{ matrix.target }}/release $EXEC_NAME
          fi

          case $RUNNER_OS in
              Windows)
                  sha256sum $ASSET_PATH > $CHECKSUM_PATH
                  ;;
              Linux)
                  sha256sum $ASSET_PATH > $CHECKSUM_PATH
                  ;;
              macOS)
                  shasum -a 256 $ASSET_PATH > $CHECKSUM_PATH
                  ;;
          esac

          echo "EXTENDED_ASSET_PATH=$ASSET_PATH" >> $GITHUB_ENV
          echo "EXTENDED_CHECKSUM_PATH=$CHECKSUM_PATH" >> $GITHUB_ENV

      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.ASSET_PATH }}
            ${{ env.CHECKSUM_PATH }}
            ${{ env.EXTENDED_ASSET_PATH }}
            ${{ env.EXTENDED_CHECKSUM_PATH }}
      - name: Upload checksum artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-checksums-${{ matrix.target }}
          path: |
            ${{ env.CHECKSUM_PATH }}
            ${{ env.EXTENDED_CHECKSUM_PATH }}

  build-node-wrapper:
    name: Build Node Wrapper Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Get Version
        run: echo GIT_VERSION="${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Create Tarball
        run: |
          ASSET_PATH="pagefind-node-wrapper-v$GIT_VERSION.tar.gz"
          tar czf $ASSET_PATH -C wrappers/node --exclude=node_modules .
          echo "NODE_WRAPPER_ASSET_PATH=$ASSET_PATH" >> $GITHUB_ENV

      - name: Upload Node Wrapper artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-node-wrapper
          path: ${{ env.NODE_WRAPPER_ASSET_PATH }}

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [build, build-node-wrapper]
    if: ${{ !cancelled() && needs.build-node-wrapper.result == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Get Version
        run: echo GIT_VERSION="${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: build-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          draft: false
          prerelease: true
          name: v${{ env.GIT_VERSION }}
          body: Pagefind with `getIndexCatalogue` added to the node wrapper, for map search integration.
          files: |
            build-artifacts/*
